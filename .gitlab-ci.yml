# ──────────────────────────────────────────────────────────────────────────────
# SupportAI · GitLab CI/CD
#
# MR / main / tags:  lint → build → test (unit, integración con SQL Server, migraciones, eval smoke)
#                    → security (SAST, secretos, paquetes vulnerables)
#                    → evaluate (prompt-eval con Claude real: manual y BLOQUEANTE si cambian prompts; ai-review opcional)
# main:              → package (zips de publicación + script SQL idempotente) → deploy-azure (App Service vía OIDC)
# tags vX.Y.Z:       → además, imágenes Docker en el Container Registry
#
# Variables de CI/CD (Settings → CI/CD → Variables):
#   ANTHROPIC_API_KEY     (masked) jobs prompt-eval y ai-review
#   GITLAB_REVIEW_TOKEN   (masked) job ai-review (project access token, scope "api", rol Reporter)
#   AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID, AZURE_RESOURCE_GROUP,
#   AZURE_API_APP, AZURE_WEB_APP, AZURE_API_URL, AZURE_WEB_URL
#                         job deploy-azure (OIDC: sin secretos de Azure; ver docs/azure-deploy.md §10)
# ──────────────────────────────────────────────────────────────────────────────

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    # Evita pipelines duplicados (branch + MR) cuando la rama tiene un MR abierto.
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/

stages:
  - lint
  - build
  - test
  - security
  - evaluate
  - package
  - deploy

variables:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"
  NUGET_PACKAGES: "$CI_PROJECT_DIR/.nuget/packages"
  HUSKY: "0"
  CONFIGURATION: "Release"
  SOLUTION: "SupportAI.sln"

default:
  image: mcr.microsoft.com/dotnet/sdk:9.0
  interruptible: true
  cache:
    key:
      files:
        - Directory.Packages.props
        - .config/dotnet-tools.json
    paths:
      - .nuget/packages
    policy: pull

include:
  - template: Jobs/SAST.gitlab-ci.yml
  - template: Jobs/Secret-Detection.gitlab-ci.yml

# ───────────────────────────── lint ─────────────────────────────

format:
  stage: lint
  cache:
    key:
      files: [Directory.Packages.props, .config/dotnet-tools.json]
    paths: [.nuget/packages]
    policy: pull-push
  script:
    - dotnet restore $SOLUTION
    - dotnet format $SOLUTION --verify-no-changes --no-restore --exclude src/SupportAI.Infrastructure/Persistence/Migrations

commit-messages:
  stage: lint
  image: alpine/git:2.47.2
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  script:
    # Mismo patrón que el hook local commit-msg (Conventional Commits).
    - git fetch --depth=200 origin "$CI_MERGE_REQUEST_TARGET_BRANCH_NAME"
    - |
      pattern='^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9._/-]+\))?!?: .{3,100}$'
      bad=0
      for sha in $(git rev-list "origin/$CI_MERGE_REQUEST_TARGET_BRANCH_NAME..HEAD"); do
        subject=$(git log -1 --format=%s "$sha")
        case "$subject" in Merge*|Revert*|fixup!*|squash!*) continue ;; esac
        if ! printf '%s' "$subject" | grep -Eq "$pattern"; then echo "✖ $sha: $subject"; bad=1; fi
      done
      exit $bad

# ───────────────────────────── build ─────────────────────────────

build:
  stage: build
  script:
    - dotnet restore $SOLUTION
    - dotnet build $SOLUTION -c $CONFIGURATION --no-restore -warnaserror
  artifacts:
    expire_in: 1 day
    paths:
      - "src/*/bin/"
      - "src/*/obj/"
      - "tests/*/bin/"
      - "tests/*/obj/"
      - "tools/*/bin/"
      - "tools/*/obj/"

# ───────────────────────────── test ─────────────────────────────

.dotnet-test:
  stage: test
  needs: [build]
  before_script:
    - dotnet tool install --tool-path /tmp/tools dotnet-reportgenerator-globaltool --version 5.4.4 >/dev/null
  after_script:
    # Resumen de cobertura en el log (GitLab extrae el % con la regex de "coverage").
    - /tmp/tools/reportgenerator -reports:"artifacts/coverage/**/coverage.cobertura.xml" -targetdir:artifacts/coverage-report -reporttypes:"TextSummary;Cobertura" || true
    - cat artifacts/coverage-report/Summary.txt 2>/dev/null | head -20 || true
  coverage: '/Line coverage: (\d+(?:\.\d+)?)%/'
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - artifacts/
    reports:
      junit: artifacts/junit/*.xml
      coverage_report:
        coverage_format: cobertura
        path: artifacts/coverage-report/Cobertura.xml

unit-tests:
  extends: .dotnet-test
  script:
    - >
      dotnet test $SOLUTION -c $CONFIGURATION --no-build
      --filter "Category!=Integration"
      --logger "junit;LogFilePath=$CI_PROJECT_DIR/artifacts/junit/{assembly}.xml"
      --collect:"XPlat Code Coverage" --results-directory artifacts/coverage

integration-tests:
  extends: .dotnet-test
  services:
    - name: mcr.microsoft.com/mssql/server:2022-latest
      alias: mssql
  variables:
    ACCEPT_EULA: "Y"
    # Contraseña de un contenedor efímero de CI (no es un secreto real).
    MSSQL_SA_PASSWORD: "Ci_Ephemeral_Passw0rd!"
    SUPPORTAI_TEST_CONNECTION: "Server=mssql,1433;Database=SupportAI_IntegrationTests;User Id=sa;Password=Ci_Ephemeral_Passw0rd!;TrustServerCertificate=True"
  script:
    - |
      echo "Esperando a SQL Server..."
      for i in $(seq 1 60); do (echo > /dev/tcp/mssql/1433) >/dev/null 2>&1 && break; sleep 2; done
      sleep 10
    - >
      dotnet test tests/SupportAI.Api.IntegrationTests -c $CONFIGURATION --no-build
      --logger "junit;LogFilePath=$CI_PROJECT_DIR/artifacts/junit/{assembly}.xml"
      --collect:"XPlat Code Coverage" --results-directory artifacts/coverage

migrations-check:
  stage: test
  needs: [build]
  script:
    - dotnet tool restore
    # Falla si alguien cambió el modelo de EF Core sin generar la migración correspondiente.
    - dotnet ef migrations has-pending-model-changes -p src/SupportAI.Infrastructure -s src/SupportAI.Infrastructure -c $CONFIGURATION --no-build

eval-smoke:
  stage: test
  needs: [build]
  script:
    # Verifica que el harness de evaluación funciona (proveedor Fake, sin costo). La heurística del Fake es la línea base.
    - dotnet run --project tests/SupportAI.PromptEvals -c $CONFIGURATION --no-build -- --provider fake --out eval-results --min-category-accuracy 0.6
  artifacts:
    when: always
    expire_in: 1 week
    paths: [eval-results/]

# ───────────────────────────── security ─────────────────────────────

sast:
  stage: security

secret_detection:
  stage: security

vulnerable-packages:
  stage: security
  needs: []
  script:
    - dotnet restore $SOLUTION
    - dotnet list $SOLUTION package --vulnerable --include-transitive 2>&1 | tee vulnerable-packages.txt
    - |
      if grep -Eq "(High|Critical)" vulnerable-packages.txt; then
        echo "✖ Hay dependencias con vulnerabilidades High/Critical."; exit 1
      fi
  artifacts:
    when: always
    paths: [vulnerable-packages.txt]

# ───────────────────────────── evaluate (IA) ─────────────────────────────

prompt-eval:
  stage: evaluate
  needs: [build]
  rules:
    # Si un MR cambia prompts o el dataset, el pipeline queda BLOQUEADO hasta que alguien ejecute la evaluación real.
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - src/SupportAI.Infrastructure/Ai/Prompts/**/*
        - evals/**/*
      when: manual
      allow_failure: false
  script:
    - test -n "$ANTHROPIC_API_KEY" || { echo "✖ Define ANTHROPIC_API_KEY como variable masked/protected."; exit 1; }
    - dotnet run --project tests/SupportAI.PromptEvals -c $CONFIGURATION --no-build -- --provider claude --out eval-results --min-category-accuracy 0.85
  artifacts:
    when: always
    expire_in: 30 days
    expose_as: "Prompt eval"
    paths: [eval-results/]

ai-review:
  stage: evaluate
  needs: [build]
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $ANTHROPIC_API_KEY && $GITLAB_REVIEW_TOKEN
      when: manual
      allow_failure: true
  variables:
    GIT_DEPTH: "0"
  script:
    - git fetch origin "$CI_MERGE_REQUEST_TARGET_BRANCH_NAME"
    - git diff --unified=3 "origin/$CI_MERGE_REQUEST_TARGET_BRANCH_NAME...HEAD" -- . ':(exclude)**/Migrations/*.Designer.cs' ':(exclude)**/*ModelSnapshot.cs' > mr.diff
    - dotnet run --project tools/SupportAI.MrReviewer -c $CONFIGURATION --no-build -- --diff mr.diff --post
  artifacts:
    when: always
    paths: [ai-review.md]

# ───────────────────────────── package ─────────────────────────────

.docker-build:
  stage: package
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  needs: [unit-tests, integration-tests]
  rules:
    # Solo en releases: el despliegue a Azure usa los zips de `publish` (ahorra minutos de CI).
    - if: $CI_COMMIT_TAG
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - IMAGE="$CI_REGISTRY_IMAGE/$IMAGE_NAME"
    - TAG="${CI_COMMIT_TAG:-$CI_COMMIT_SHORT_SHA}"
    - docker build --pull -f "$DOCKERFILE" --label "org.opencontainers.image.revision=$CI_COMMIT_SHA" -t "$IMAGE:$TAG" .
    - docker push "$IMAGE:$TAG"
    - |
      if [ "$CI_COMMIT_BRANCH" = "$CI_DEFAULT_BRANCH" ]; then
        docker tag "$IMAGE:$TAG" "$IMAGE:main" && docker push "$IMAGE:main"
      fi

package-api:
  extends: .docker-build
  variables:
    IMAGE_NAME: api
    DOCKERFILE: src/SupportAI.Api/Dockerfile

package-web:
  extends: .docker-build
  variables:
    IMAGE_NAME: web
    DOCKERFILE: src/SupportAI.Web/Dockerfile

publish:
  stage: package
  needs: [build]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
  script:
    - dotnet publish src/SupportAI.Api -c $CONFIGURATION -o artifacts/publish/api -p:UseAppHost=false
    - dotnet publish src/SupportAI.Web -c $CONFIGURATION -o artifacts/publish/web -p:UseAppHost=false
    # La imagen del SDK de .NET incluye PowerShell: comprime el contenido (no la carpeta) para App Service.
    - pwsh -NoProfile -Command "Compress-Archive -Path artifacts/publish/api/* -DestinationPath artifacts/api.zip"
    - pwsh -NoProfile -Command "Compress-Archive -Path artifacts/publish/web/* -DestinationPath artifacts/web.zip"
  artifacts:
    expire_in: 7 days
    paths:
      - artifacts/api.zip
      - artifacts/web.zip

migration-script:
  stage: package
  needs: [build]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG
  script:
    - dotnet tool restore
    # Script idempotente: se puede aplicar en cualquier entorno, sin importar en qué migración esté.
    - dotnet ef migrations script --idempotent -p src/SupportAI.Infrastructure -s src/SupportAI.Infrastructure -c $CONFIGURATION --no-build -o artifacts/migrations.sql
  artifacts:
    expire_in: 90 days
    paths: [artifacts/migrations.sql]

# ───────────────────────────── deploy ─────────────────────────────

deploy-azure:
  stage: deploy
  image: mcr.microsoft.com/azure-cli:latest
  needs: [publish, unit-tests, integration-tests, migrations-check]
  # OIDC: GitLab emite un token firmado para este job y Azure lo canjea (credencial federada).
  # No hay contraseñas ni secretos de Azure guardados en GitLab.
  id_tokens:
    AZURE_ID_TOKEN:
      aud: api://AzureADTokenExchange
  environment:
    name: azure
    url: $AZURE_WEB_URL
  resource_group: azure
  rules:
    # Solo en main y solo si Azure está configurado (sin variables, el job no aparece).
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH && $AZURE_CLIENT_ID && $AZURE_TENANT_ID && $AZURE_RESOURCE_GROUP
  script:
    - az login --service-principal --username "$AZURE_CLIENT_ID" --tenant "$AZURE_TENANT_ID" --federated-token "$AZURE_ID_TOKEN" --output none
    - if [ -n "$AZURE_SUBSCRIPTION_ID" ]; then az account set --subscription "$AZURE_SUBSCRIPTION_ID"; fi
    - az webapp deploy --resource-group "$AZURE_RESOURCE_GROUP" --name "$AZURE_API_APP" --src-path artifacts/api.zip --type zip --clean true --restart true
    - az webapp deploy --resource-group "$AZURE_RESOURCE_GROUP" --name "$AZURE_WEB_APP" --src-path artifacts/web.zip --type zip --clean true --restart true
    - |
      # Smoke test: la API debe responder Healthy (incluye la base de datos). La BD serverless puede tardar en despertar.
      if [ -n "$AZURE_API_URL" ]; then
        for i in $(seq 1 30); do
          if curl -fsS "${AZURE_API_URL%/}/health/ready" | grep -q Healthy; then echo "API Healthy"; exit 0; fi
          echo "Esperando a la API ($i/30)..."; sleep 10
        done
        echo "✖ La API no respondió Healthy tras el despliegue. Revisa el Log stream en Azure."; exit 1
      fi
