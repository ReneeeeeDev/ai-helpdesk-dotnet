# Stack completo para desarrollo o demo:  docker compose up --build
# Web: http://localhost:8081   API + Scalar: http://localhost:8080/scalar/v1
# Para usar Claude real: exporta ANTHROPIC_API_KEY y LLM_PROVIDER=Claude antes de levantar.

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:-SupportAI_Dev_2026!}"
    ports:
      - "14333:1433"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  api:
    build:
      context: .
      dockerfile: src/SupportAI.Api/Dockerfile
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__SupportAI: "Server=sqlserver,1433;Database=SupportAI;User Id=sa;Password=${MSSQL_SA_PASSWORD:-SupportAI_Dev_2026!};TrustServerCertificate=True"
      Database__ApplyMigrationsOnStartup: "true"
      Database__SeedDemoData: "true"
      Jwt__SigningKey: "${JWT_SIGNING_KEY:-compose-dev-signing-key-change-me-0123456789}"
      Llm__Provider: "${LLM_PROVIDER:-Fake}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
    ports:
      - "8080:8080"

  web:
    build:
      context: .
      dockerfile: src/SupportAI.Web/Dockerfile
    depends_on:
      - api
    environment:
      Api__BaseUrl: "http://api:8080/"
    ports:
      - "8081:8080"
